<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prediction results | No Bank</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500&display=swap">
<style>
:root{--bg:#0b0a08;--card:#14120e;--line:rgba(212,175,55,.28);--gold:#d4af37;--gold2:#f3dc9a;--tx:#f5efe0;--mut:#a89c80;--red:#e5736b;--grn:#7fcf9b;--amb:#e8b84f;--serif:'Playfair Display',Georgia,serif;--sans:'Inter',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(700px 260px at 50% -8%,rgba(212,175,55,.22),transparent),var(--bg);color:var(--tx);font-family:var(--sans);line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:28px 16px 64px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:28px}
.logo{font-family:var(--serif);letter-spacing:.22em;font-size:18px;color:var(--gold)}
.top span{color:var(--mut);font-size:13px}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(28px,5vw,40px);margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 20px}
.prog{position:sticky;top:0;z-index:5;background:rgba(11,10,8,.92);backdrop-filter:blur(8px);padding:10px 0 12px;margin-bottom:8px}
.prog .t{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:6px}
.track{height:3px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .3s}
.card,.form-section{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px;margin-bottom:18px}
.sec-t{display:flex;align-items:baseline;gap:12px;font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 18px}
.sec-t b{font-size:13px;color:var(--gold);letter-spacing:.15em;font-family:var(--sans);font-weight:500}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.form-group.full{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
input[type=text],input[type=number],select{width:100%;padding:11px 12px;background:#0d0c09;border:1px solid var(--line);border-radius:4px;color:var(--tx);font:inherit}
input:focus,select:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.18)}
.hint{font-size:12px;color:#7d7357;margin-top:5px}
.error-message{display:none;font-size:12px;color:var(--red);margin-top:5px}
.form-group.error .error-message{display:block}
.form-group.error input,.form-group.error select{border-color:var(--red)}
.radio-group{display:flex;gap:12px}
.radio-group label{display:flex;align-items:center;gap:8px;margin:0;padding:10px 18px;border:1px solid var(--line);border-radius:4px;color:var(--tx);cursor:pointer}
.radio-group input{accent-color:var(--gold)}
.btn{font:inherit;font-weight:500;padding:13px 26px;border:0;border-radius:4px;cursor:pointer;background:linear-gradient(90deg,var(--gold),var(--gold2));color:#1a1405;box-shadow:0 0 24px rgba(212,175,55,.25)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--tx);box-shadow:none}
#successMessage{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.card h2{font-family:var(--serif);font-weight:500;font-size:18px;margin:0 0 2px}
.lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.ring{--p:0;width:130px;height:130px;margin:14px auto;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.08) 0);display:grid;place-items:center;box-shadow:0 0 28px rgba(212,175,55,.2)}
.ring div{width:100px;height:100px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:var(--serif);font-size:26px}
.big{font-family:var(--serif);font-size:34px;color:var(--gold2);margin:14px 0 8px;word-break:break-word}
.risk-badge{display:inline-block;font-size:12px;padding:3px 12px;border-radius:99px;border:1px solid transparent}
.risk-low{color:var(--grn);border-color:var(--grn)}
.risk-medium{color:var(--amb);border-color:var(--amb)}
.risk-high{color:var(--red);border-color:var(--red)}
.detail{font-size:14px;color:var(--mut);margin-top:12px}
.detail strong{color:var(--tx);font-weight:500}
.sum p{color:var(--mut);margin:4px 0 14px}
.hid{display:none}
.error-section{border:1px solid var(--red);color:var(--red);padding:14px;border-radius:4px;margin-bottom:18px}
.error-section a{color:var(--gold)}
@media print{.acts{display:none}body{background:#fff;color:#111}.card{background:#fff;border-color:#bbb}.big,.logo{color:#7a5d00}.detail,.sum p{color:#333}.ring div{background:#fff}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="logo">NO BANK</div><div class="acts"><button class="btn ghost" onclick="goBack()">New assessment</button> <button class="btn" onclick="printResults()">Print report</button></div></div>
<h1>Prediction results</h1>
<p class="sub"><span id="customerName"></span> &middot; <span id="timestamp"></span></p>
<div id="errorSection"></div>
<div class="grid">
<div class="card"><h2>Default risk</h2><div class="lab">Logistic regression</div><div class="ring" id="ring1"><div id="value1">-</div></div><div style="text-align:center"><span id="badge1" class="risk-badge"></span></div><div class="track hid"><i id="progress1"></i></div><div class="detail" id="detail1"></div></div>
<div class="card"><h2>Churn risk</h2><div class="lab">Random forest</div><div class="ring" id="ring2"><div id="value2">-</div></div><div style="text-align:center"><span id="badge2" class="risk-badge"></span></div><div class="track hid"><i id="progress2"></i></div><div class="detail" id="detail2"></div></div>
<div class="card"><h2>Customer segment</h2><div class="lab">K-means</div><div class="big" id="value3">-</div><div class="detail" id="detail3"></div></div>
<div class="card"><h2>Lifetime value</h2><div class="lab">Linear regression</div><div class="big" id="value4">-</div><div class="detail" id="detail4"></div></div>
</div>
<div class="card sum" style="margin-top:18px"><h2>Summary</h2><div class="lab">Overall risk</div><p id="summaryRisk"></p><div class="lab">Recommended actions</div><p id="summaryActions"></p><div class="lab">Opportunity</div><p id="summaryOpportunity"></p></div>
</div>
<script>
        // Load results from localStorage
        function loadResults() {
            const resultsJSON = localStorage.getItem('predictionResults');
            
            if (!resultsJSON) {
                document.getElementById('errorSection').innerHTML = `
                    <div class="error-section">
                        <strong>Error:</strong> No prediction results found. <a href="/">Go back to form</a>
                    </div>
                `;
                return;
            }
 
            const results = JSON.parse(resultsJSON);
            
            // Display header
            document.getElementById('customerName').textContent = `${results.customer_name}`;
            document.getElementById('timestamp').textContent = `Generated: ${results.timestamp}`;
 
            // Model 1: Default Risk
            const m1 = results.model_1_default_risk;
            if (m1.error) {
                document.getElementById('value1').textContent = 'ERROR';
                document.getElementById('detail1').textContent = m1.error;
            } else {
                const percentage = m1.risk_percentage || 0;
                document.getElementById('value1').textContent = percentage.toFixed(1) + '%';
                document.getElementById('progress1').style.width = percentage + '%';
                document.getElementById('badge1').textContent = m1.risk_level;
                document.getElementById('badge1').className = 'risk-badge ' + getRiskClass(m1.risk_level);
                document.getElementById('detail1').innerHTML = `
                    <strong>Prediction:</strong> ${m1.prediction}<br>
                    <strong>Risk Level:</strong> ${m1.risk_level}
                `;
            }
 
            // Model 2: Churn Risk
            const m2 = results.model_2_churn_risk;
            if (m2.error) {
                document.getElementById('value2').textContent = 'ERROR';
                document.getElementById('detail2').textContent = m2.error;
            } else {
                const percentage = m2.risk_percentage || 0;
                document.getElementById('value2').textContent = percentage.toFixed(1) + '%';
                document.getElementById('progress2').style.width = percentage + '%';
                document.getElementById('badge2').textContent = m2.risk_level;
                document.getElementById('badge2').className = 'risk-badge ' + getRiskClass(m2.risk_level);
                document.getElementById('detail2').innerHTML = `
                    <strong>Prediction:</strong> ${m2.prediction}<br>
                    <strong>Risk Level:</strong> ${m2.risk_level}
                `;
            }
 
            // Model 3: Segmentation
            const m3 = results.model_3_segmentation;
            if (m3.error) {
                document.getElementById('value3').textContent = 'ERROR';
                document.getElementById('detail3').textContent = m3.error;
            } else {
                document.getElementById('value3').textContent = m3.segment;
                document.getElementById('detail3').innerHTML = `
                    <strong>Cluster:</strong> ${m3.cluster}<br>
                    <strong>Segment:</strong> ${m3.segment}
                `;
            }
 
            // Model 4: Profitability
            const m4 = results.model_4_profitability;
            if (m4.error) {
                document.getElementById('value4').textContent = 'ERROR';
                document.getElementById('detail4').textContent = m4.error;
            } else {
                document.getElementById('value4').textContent = m4.clv_formatted;
                document.getElementById('detail4').innerHTML = `
                    <strong>Predicted CLV:</strong> ${m4.clv_formatted}<br>
                    <strong>Profit Level:</strong> ${m4.profit_level}
                `;
            }
 
            // Generate Summary
            generateSummary(results);
        }
 
        function getRiskClass(riskLevel) {
            if (riskLevel.includes('Low')) return 'risk-low';
            if (riskLevel.includes('High')) return 'risk-high';
            return 'risk-medium';
        }
 
        function generateSummary(results) {
            const m1 = results.model_1_default_risk;
            const m2 = results.model_2_churn_risk;
            const m3 = results.model_3_segmentation;
            const m4 = results.model_4_profitability;
 
            // Overall Risk
            let overallRisk = 'Moderate';
            if (m1.risk_level && m1.risk_level.includes('High')) overallRisk = 'High';
            if (m1.risk_level && m1.risk_level.includes('Low') && m2.risk_level && m2.risk_level.includes('Low')) overallRisk = 'Low';
 
            document.getElementById('summaryRisk').textContent = 
                `This customer has ${overallRisk.toLowerCase()} overall risk. Default risk: ${m1.risk_percentage?.toFixed(1)}%, Churn risk: ${m2.risk_percentage?.toFixed(1)}%. Segment: ${m3.segment}`;
 
            // Recommendations
            let actions = [];
            if (m1.risk_level && m1.risk_level.includes('High')) {
                actions.push('🔴 Implement enhanced credit monitoring and risk mitigation strategies');
            }
            if (m2.risk_level && m2.risk_level.includes('High')) {
                actions.push('⚠️ Launch retention campaign to prevent customer churn');
            }
            if (m1.risk_level && m1.risk_level.includes('Low') && m2.risk_level && m2.risk_level.includes('Low')) {
                actions.push('✅ Low-risk customer - suitable for upselling and cross-selling opportunities');
            }
            actions.push('📊 Monitor customer behavior and engagement metrics regularly');
 
            document.getElementById('summaryActions').textContent = actions.join(' | ');
 
            // Opportunity
            if (m4.clv_predicted > 2000000) {
                document.getElementById('summaryOpportunity').textContent = 
                    `High-value customer with strong lifetime value (${m4.clv_formatted}). Prioritize relationship management and personalized service.`;
            } else if (m4.clv_predicted > 1000000) {
                document.getElementById('summaryOpportunity').textContent = 
                    `Medium-value customer with solid potential (${m4.clv_formatted}). Focus on deepening engagement and loyalty.`;
            } else {
                document.getElementById('summaryOpportunity').textContent = 
                    `Standard customer segment (${m4.clv_formatted}). Build relationship foundation for future growth.`;
            }
        }
 
        function printResults() {
            window.print();
        }
 
        function goBack() {
            window.location.href = '/';
        }
 
        // Load results on page load
        window.addEventListener('load', loadResults);
    </script>
<script>
window.addEventListener('load',function(){[1,2].forEach(function(n){var w=parseFloat(document.getElementById('progress'+n).style.width)||0;document.getElementById('ring'+n).style.setProperty('--p',w);});});
</script>
</body>
</html>
